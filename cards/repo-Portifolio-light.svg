<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="148" viewBox="0 0 293.333 148" role="img" aria-label="Portifolio: Portfólio pessoal em PT/EN feito com Next.js, Tailwind CSS e Motion."><title>Portifolio: Portfólio pessoal em PT/EN feito com Next.js, Tailwind CSS e Motion.</title><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.cur{opacity:0}@keyframes sobe{from{opacity:0;transform:translateY(8px)}}@keyframes surge{from{opacity:0}}@keyframes vis{from,to{opacity:1}}@keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulsa{50%{opacity:.35}}@keyframes onda{0%,14%,100%{opacity:0}7%{opacity:1}}@keyframes cutuca{50%{transform:translate(2px,-2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g style="animation:sobe .6s cubic-bezier(.2,.7,.2,1) 0.22s both"><rect x="4.5" y=".5" width="284.333" height="135" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="22" y="34" class="m" font-size="14" font-weight="600" fill="#0f7b53">Portifolio</text><text x="22" y="60" class="s" font-size="13" fill="#59636e">Portfólio pessoal em PT/EN feito com</text><text x="22" y="79" class="s" font-size="13" fill="#59636e">Next.js, Tailwind CSS e Motion.</text><circle cx="27" cy="115" r="5" fill="#2f74c0" style="animation:pulsa 3s ease-in-out 0.40s infinite"/><text x="39" y="119" class="m" font-size="11" fill="#59636e">TypeScript</text><g transform="translate(257.333 22)"><path d="M1 11 11 1M4 1h7v7" fill="none" stroke="#0f7b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="animation:cutuca 2.4s ease-in-out 0.30s infinite"/></g></g></svg>
